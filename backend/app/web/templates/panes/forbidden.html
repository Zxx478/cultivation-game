<section class="pane" data-pane="forbidden" id="pane-forbidden" hidden aria-labelledby="forbidden-title">
  <header class="pane__head">
    <p class="pane__kicker">九 · 禁地</p>
    <h2 class="pane__title" id="forbidden-title">禁地</h2>
    <p class="pane__sub" id="forbidden-sub">十处死地，仅两处可入。散修方得踏足。</p>
  </header>

  <div class="pane__body">
    <div class="card">
      <header class="card__head">
        <h3 class="card__title">可入之地</h3>
        <p class="card__meta" id="forbidden-meta">—</p>
      </header>
      <div class="card__body">
        <ul class="landlist" id="forbidden-open"></ul>
      </div>
    </div>

    <div class="card">
      <header class="card__head">
        <h3 class="card__title">未开之地</h3>
        <p class="card__meta">尚在封禁</p>
      </header>
      <div class="card__body">
        <ul class="landlist landlist--sealed" id="forbidden-sealed"></ul>
      </div>
    </div>
  </div>
</section>
