# ============================================================
# 《荒天纪》v1.5 · 区域（regions.yaml）
# ============================================================
# 用途：20 个区域全量配置；MVP 只开放 6 个（enabled: true）。
#       环境系数直接进 ExpRate 乘算；enemies 引用 enemies.yaml 的 id。
# 字段：
#   id            区域枚举（character.region_id），禁止改名
#   name          上线名
#   level_min/max 可进入/可刷怪的全局等级区间（1–100）
#   env_coef      环境系数（1.0 / 1.5 / 2.0 / 3.0 / 5.0），进修为公式
#   env_label     环境说明（灵脉/福地/圣地/时间秘境）
#   materials     特产材料（item_id 数组，引用 items.yaml；空数组表示 V1.0 补内容）
#   material_note 特产文本（含尚未入 items.yaml 的 V1.0 材料）
#   enemies       常驻敌人（enemy_id 数组）
#   boss          区域首领（enemy_id 或 null）
#   travel_days   从相邻区域前往耗时（游戏日）
#   safe_zone     安全区不刷怪
#   enabled       MVP 是否开放
#   desc          描述文案
# ============================================================

regions:
  # ================= 卷一（断槐村 1–9，MVP 全开） =================
  - id: duanhuai_village
    name: 断槐村
    level_min: 1
    level_max: 4
    env_coef: 1.0
    env_label: 无
    materials: [zhixue_cao]
    material_note: 止血草
    enemies: []
    boss: null
    travel_days: 1
    safe_zone: true
    enabled: true
    desc: 村口老槐断了一半，另一半还活着。你在这里出生，也在这里学会锻血。

  - id: back_hill
    name: 村后山
    level_min: 2
    level_max: 6
    env_coef: 1.0
    env_label: 无
    materials: [zhixue_cao, shou_gu]
    material_note: 兽骨、止血草
    enemies: [dushan_shanmao, huangyuan_lang, shougu_yaolang]
    boss: dushan_shanmao_wang
    travel_days: 1
    safe_zone: false
    enabled: true
    desc: 山不高，柴草却密。日头一落，猫叫就从石缝里出来。

  - id: herb_slope
    name: 药坡
    level_min: 3
    level_max: 9
    env_coef: 1.0
    env_label: 无
    materials: [long_xue_cao, zhixue_cao]
    material_note: 龙血草（十二中见一）、止血草
    enemies: [huangyuan_lang, shanye_tufei, shougu_yaolang]
    boss: null
    travel_days: 1
    safe_zone: false
    enabled: true
    desc: 坡向西南，日头足。草叶背面全是红的，像谁的血。

