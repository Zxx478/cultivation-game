# ------------------------------------------------------------
# 校验断言：
#   1) regions 恰 20 条；enabled=true 恰为 duanhuai_village / back_hill /
#      herb_slope / qingyun_outer / spirit_creek / palace_secret；
#   2) level_min/max 并集覆盖 1–18 无空洞（MVP 6 区）；
#   3) env_coef ∈ {1.0, 1.5, 2.0, 3.0, 5.0}；
#   4) materials / enemies / boss 中的 id 必须可达。
# 说明：14 个未开放区域的 enemies 与 materials 留空，属 V1.0 内容位；
#       其特产仅以 material_note 纯文本占位，避免引用不存在的 item_id
#       （items.yaml 被硬约束为 15 条）。
