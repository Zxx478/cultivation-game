# ------------------------------------------------------------
# 校验断言：
#   1) events 恰 20 条；id 唯一；每条 choices 数 ∈ [2,4]；
#   2) 每个 choice 至少 1 项负面代价（time_cost_days > 0，或
#      success_effects/fail_effects 中存在负值 karma/attr/hp_pct）；
#   3) 引用到的 item_id / tech_id 必须可达（vendored 于 items.yaml / techniques.yaml）；
#   4) 类别分布：resource 3 / npc 4 / combat 3 / fortune 3 / trap 4 / karma 3。
# 说明：效果 type 中 dao_heart 是"道心"专用通道（区别于普通 attr），
#       引擎需按 character.dao_heart 单独落地；status 取值 currently 用到
#       injured / poisoned / heart_crack / qi_deviation 四种；
#       check: null 的选项为"必定成功"，其 fail_effects 一律为空数组。
