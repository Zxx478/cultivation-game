# ============================================================
# 《荒天纪》v1.5 · 事件（events.yaml）
# ============================================================
# 用途：20 条可触发事件。行动结算后按 game.yaml.event.trigger_bp 判定，
#       命中后在「区域 × 境界 × 30 月未出」的候选池中按权重抽 1 条。
# 硬规则：每条恰 2–4 个选项；**每个选项至少 1 项负面代价**
#         （时间 / 气血 / 因果 / 属性任一为负）。
# 字段：
#   id          事件枚举，禁止改名（主线 #6 会强制触发 village_cry）
#   title       标题
#   body        正文（≤200 字，半文半白，单句 ≤25 字）
#   category    resource|npc|combat|fortune|trap|karma
#   weight      事件权重（同类别内相对值；类别权重见 game.yaml.event.category_weights_bp）
#   region_ids  可触发区域
#   level_min/level_max  可触发等级区间
#   forced_by_quest  被主线强制触发时填写任务 id（不走随机池）
#   choices     选项数组
#     id / label        选项枚举与文案
#     risk              风险标记 low|mid|high（UI 只显示标记，不显示成功率）
#     check             判定（attr 取 str|con|spr|sen|wis|agi|luk；difficulty_bp 为基础成功率）
#                       null 表示必定成功（如退避）
#     time_cost_days    固定耗时（游戏日），0 表示不额外耗时
#     success_effects / fail_effects  效果数组，元素 {type, ...}
#       可用 type：cultivation / spirit_stone / item{item_id,qty} /
#                  item_loss{item_id,qty}（扣道具）/ karma /
#                  hp_pct / mp_pct / attr{key,value} / status{key} /
#                  dao_heart{value} / favor{npc_id,value} /
#                  technique{tech_id} / flag{key}
# ============================================================

events:
  # ---------------- 因果业报类（5） ----------------
  - id: village_cry
    title: 村里的哭声
    category: karma
    weight: 5
    region_ids: [duanhuai_village]
    level_min: 4
    level_max: 9
    forced_by_quest: quest_06
    body: >-
      夜里有人在村口哭。一个孩子被荒兽堵在柴房里。火光只照亮半面墙。
      屋里的人都在等。等谁先出去，等谁先开口。
    choices:
      - id: save
        label: 循声而去
        risk: high
        check: {attr: str, difficulty_bp: 5500}
        time_cost_days: 30
        success_effects:
          - {type: karma, value: 50}
          - {type: attr, key: luk, value: 2}
          - {type: cultivation, value: 300}
        fail_effects:
          - {type: karma, value: 30}
          - {type: hp_pct, value: -40}
          - {type: status, key: injured}
      - id: ignore
        label: 掩门不问
        risk: low
        check: null
        time_cost_days: 0
        success_effects:
          - {type: spirit_stone, value: 200}
          - {type: karma, value: -30}
        fail_effects:
          - {type: karma, value: -30}

