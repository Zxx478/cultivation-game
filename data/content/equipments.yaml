# ============================================================
# 《荒天纪》v1.5 · 装备（equipments.yaml）
# ============================================================
# 用途：6 槽位定义 + 7 档稀有度权重 + 主词条区间 + 11 条副词条池 +
#       强化规则 + 11 个装备模板（模板 id 与既有 SEED_EQUIPMENT 一致）。
# 生成规则：先按 slot 取模板 → 按稀有度权重抽档 → 按档位决定词条数 →
#           主词条按槽位固定，副词条从 affix_pool 无放回抽 N 条。
# 字段见各段注释。
# ============================================================

# ---------- 6 槽位 ----------
slots:
  - {id: weapon,    name: 武器（主手）, main_affix: atk,       main_values: {xia: 12, zhong: 24, shang: 40}, note: 刀剑枪鼎幡拳套}
  - {id: armor,     name: 护甲（身）,   main_affix: def,       main_values: {xia: 8,  zhong: 16, shang: 28}, note: 轻甲重甲法袍}
  - {id: helm,      name: 头冠,         main_affix: sen,       main_values: {xia: 6,  zhong: 12, shang: 20}, note: 冠盔面饰}
  - {id: accessory, name: 饰品,         main_affix: luk,       main_values: {xia: 2,  zhong: 4,  shang: 7},  note: 玉佩戒指铃}
  - {id: natal,     name: 本命法器,     main_affix: atk_spr,   main_values: {xia: 10, zhong: 20, shang: 34}, note: 唯一，可祭炼（MVP 仅展示）}
  - {id: storage,   name: 储物戒,       main_affix: bag_slots, main_values: {xia: 10, zhong: 18, shang: 30}, note: 唯一，扩容背包}

# ---------- 7 档稀有度（权重合计 10000bp） ----------
rarity:
  - {id: crude,    name: 粗劣, color: gray,   weight_bp: 3000, affix_count: 0, extra_special: 0, value_multiplier_bp: 6000}
  - {id: common,   name: 普通, color: white,  weight_bp: 3500, affix_count: 1, extra_special: 0, value_multiplier_bp: 10000}
  - {id: fine,     name: 精良, color: green,  weight_bp: 2000, affix_count: 2, extra_special: 0, value_multiplier_bp: 13000}
  - {id: rare,     name: 稀有, color: blue,   weight_bp: 1000, affix_count: 3, extra_special: 0, value_multiplier_bp: 17000}
  - {id: epic,     name: 史诗, color: purple, weight_bp: 400,  affix_count: 4, extra_special: 0, value_multiplier_bp: 22000}
  - {id: legend,   name: 传说, color: orange, weight_bp: 90,   affix_count: 4, extra_special: 1, value_multiplier_bp: 30000}
  - {id: myth,     name: 神话, color: red,    weight_bp: 10,   affix_count: 5, extra_special: 1, value_multiplier_bp: 40000}

# ---------- 副词条池（11 条，权重合计 10000bp，同件装备不重复） ----------
affix_pool:
  - {id: str,     name: 力量,     min_pct: 3,  max_pct: 12, weight_bp: 1400}
  - {id: con,     name: 体魄,     min_pct: 3,  max_pct: 12, weight_bp: 1400}
  - {id: spr,     name: 灵力,     min_pct: 3,  max_pct: 12, weight_bp: 1400}
  - {id: sen,     name: 神识,     min_pct: 3,  max_pct: 12, weight_bp: 1200}
  - {id: agi,     name: 身法,     min_pct: 3,  max_pct: 12, weight_bp: 1200}
  - {id: hp,      name: 气血上限, min_pct: 4,  max_pct: 15, weight_bp: 1200}
  - {id: crit,    name: 暴击率,   min_pct: 1,  max_pct: 6,  weight_bp: 800}
  - {id: crit_dmg,name: 暴击伤害, min_pct: 5,  max_pct: 25, weight_bp: 600}
  - {id: pen,     name: 破防,     min_pct: 2,  max_pct: 10, weight_bp: 500}
  - {id: cult,    name: 修炼速度, min_pct: 2,  max_pct: 8,  weight_bp: 200}
  - {id: luk,     name: 气运,     min_pct: 1,  max_pct: 5,  weight_bp: 100}

# ---------- 强化（MVP 上限 +5） ----------
enhance:
  max_level: 5
  bonus_per_level_bp: 800          # 每级强化 = 基础主词条 × 8%（+5 = +40%）
  success_base_bp: 10000
  success_step_bp: 500             # 每级 −5%
  success_min_bp: 2500             # 下限 25%
  # 强化消耗：MVP 无"强化石"道具（items.yaml 只 15 条），折为纯灵石
  cost_spirit_stone_per_level: 200
  cost_formula: "200 × (当前强化等级 + 1)"
  downgrade_on_fail: false         # +1..+5 失败不降级（任务书 §4.3 口径）
  refine_enabled: false            # 精炼 MVP 不实现（R56 返回 501）

