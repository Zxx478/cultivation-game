# ------------------------------------------------------------
# 校验断言：
#   1) slots 恰 6 条；rarity 恰 7 条且 weight_bp 合计 10000；
#   2) affix_pool 恰 11 条且 weight_bp 合计 10000；
#   3) templates 恰 11 条，id 与 SEED_EQUIPMENT 的 11 个完全一致；
#   4) enhance.max_level = 5，bonus_per_level_bp = 800（R55）。
# 偏离说明：
#   a) 任务书要求 7 档稀有度权重 30/35/20/10/4/0.9/0.1（%），本表以 bp 整数
#      表达为 3000/3500/2000/1000/400/90/10，避免 YAML 浮点误差；
#   b) 原 §5.4 强化上限 +15 与"强化石"配方，MVP 按裁决改为 +5、纯灵石，
#      seed_sub_tier 字段保留既有 DB 展示串（凡·精良 等）以免兑换页文案错位。
