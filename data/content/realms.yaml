# ============================================================
# 《荒天纪》v1.5 · 境界阶梯（realms.yaml）
# ============================================================
# 用途：12 境全量配置。全局等级 global_level = 9 × (order - 1) + 小境序号。
#       MVP 仅开放前 2 境（forging_blood / open_palace，Lv.1–18），
#       其余 10 境 enabled: false，仅作配置占位（V1.0 起逐卷启用）。
# 字段：
#   id                    境界枚举（realm_id），代码与 DB 唯一标识，禁止改名
#   display_name          上线名（UI/文案必用；禁止出现原著参考名）
#   order                 1–12，境界序号（时间膨胀与修为系数都按它算）
#   level_start/level_end 全局等级区间（闭区间；emperor 只有 100 一级）
#   base_lifespan_years   基准寿元（年），突破成功时整体重算
#   exp_k_bp              修为曲线系数 K × 10000（1.0 → 10000）
#   power_coef            战力系数（HP/MP/减伤公式中的"境界战力系数"）
#   breakthrough_base_bp  本境基础突破成功率（bp）
#   enabled               MVP 是否开放
#   per_level_growth      每小境（每级）属性自然成长
#   breakthrough_items    突破本境所需辅材（引用 items.yaml 的 id）
#   unlock_features       本境解锁的玩法权限键
# ============================================================

realms:
