    display_name: 锻血
    order: 1
    level_start: 1
    level_end: 9
    stage_count: 9
    stage_note: 九次锻血（一至九炼）
    base_lifespan_years: 100
    exp_k_bp: 10000
    power_coef: 1.0
    breakthrough_base_bp: 8500
    enabled: true
    per_level_growth: {str: 1, con: 1, spr: 1, sen: 1, bon: 0, agi: 1}
    breakthrough_items: []          # 锻血境只要求 Lv.9 满 + 修为满 + 气血 ≥ 80%
    unlock_features: [cultivate, adventure, gather, spar, bag, event]

