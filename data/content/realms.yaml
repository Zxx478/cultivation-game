# ------------------------------------------------------------
# 配置说明 / 口径备忘
# ------------------------------------------------------------
# 1) 后 10 境的 breakthrough_items 统一引用 ling_ye（灵液）作辅材占位，
#    原因：MVP 的 items.yaml 只允许 15 条（6 丹 + 4 材 + 5 消耗品），
#    刻纹刀/归一石/帝血等专属辅材未入表；V1.1 扩充 items.yaml 后
#    逐境替换为专属材料，不需要改引擎。
# 2) emperor 为终局境界：无下一境，breakthrough_base_bp = 0 且 is_terminal: true，
#    引擎不得为其生成突破按钮。
# 3) 寿元为「基准值」，突破成功时整体重算（不是加差值）：
#    锻血→辟府净增 50 年。
# 4) 校验断言：realms 恰 12 条；enabled=true 恰为 forging_blood、open_palace；
#    order 连续 1–12；level_start/level_end 覆盖 1–100 无空洞无重叠。
