# ============================================================
# 《荒天纪》v1.5 · 主线任务（quests_main.yaml）
# ============================================================
# 用途：19 条主线（卷一 10 + 卷二 9），对应 Lv.1–18 全部流程。
#       任务不写死文案分支，全部由 objectives + rewards 驱动。
# 状态机：locked →(前置完成) active →(目标计数满) ready →(/quests/claim) completed
# 字段：
#   id             任务枚举 quest_01..quest_19
#   order          1–19，顺序即解锁链
#   volume         1=卷一（锻血 Lv.1–9）｜2=卷二（辟府 Lv.10–18）
#   title/desc     标题与文案（半文半白）
#   level_min/max  可执行等级窗口（相邻任务允许交界重叠，并集须覆盖 1–18 无空洞）
#   trigger_level  前置满足后的激活等级（PRD §6.2 的触发条件）
#   region_id      引导区域
#   prereq         前置任务 id 数组（空 = 开局即 active）
#   objective_rule all（全达成）| any_group（任一组全达成）
#   objectives     目标数组（group 为分组键）
#   rewards        exp/stones/items/equipments/techniques/attrs/contribution/flags
#   unlock_next    完成后自动置为 active 的任务
# 目标类型（13 种）：
#   talk{npc_id,count} / cultivate{count} / kill{enemy_id,count}
#   collect{item_id,count} / deliver{item_id,count,npc_id}
#   reach_level{level} / breakthrough{realm_index} / join_sect{accept_sect_ids}
#   choose_direction{directions} / complete_sect_quest{count}
#   sansxiu_encounter{count} / enter_forbidden{land_id,count} / event_choice{event_id}
# ============================================================

