# ------------------------------------------------------------
# 校验断言：
#   1) quests 恰 19 条（卷一 10 + 卷二 9）；order 连续 1–19；
#   2) prereq 引用的 id 必须存在且 order 更小；unlock_next 必须能被
#      prereq 反向推出（链条闭合，quest_19 的 unlock_next 为空）；
#   3) 目标类型覆盖 13 种：talk/cultivate/kill/collect/deliver/reach_level/
#      breakthrough/join_sect/choose_direction/complete_sect_quest/
#      sansxiu_encounter/enter_forbidden/event_choice；
#   4) kill.enemy_id ∈ enemies.yaml；collect/deliver.item_id ∈ items.yaml；
#      event_id ∈ events.yaml；land_id ∈ forbidden_lands.yaml；
#      techniques ∈ techniques.yaml；equipments ∈ equipments.yaml；
#   5) level_min/level_max 按 order 排序后满足 next.level_min ≤ prev.level_max + 1
#      （并集覆盖 1–18 无空洞）。**相邻任务允许交界重叠**：10 个任务要覆盖
#      卷一的 9 个等级，严格"无重叠"在算术上不可能，故校验口径取"无空洞"。
