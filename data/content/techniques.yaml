# ============================================================
# 《荒天纪》v1.5 · 功法（techniques.yaml）
# ============================================================
# 用途：41 部功法全量配置。id 必须与 backend/app/db/repository.py 的
#       SEED_TECHNIQUES 完全一致（该表是宗门兑换/禁地首通发放的主键）；
#       缺失即会导致"扣了贡献却发不出功法"。
# 构成：通用 12（不绑宗门）+ 宗门独有 24（6 宗 × 4）+ 散修/禁地 5。
# 字段：
#   id                     功法枚举，禁止改名
#   name                   上线名（含书名号）
#   tier                   品阶 fan|ling|bao|sheng|di
#   sub_tier               品级 xia|zhong|shang
#   type                   heart(心法) | attack(攻击) | defense(防御) | support(辅助)
#   required_realm_index   可修习最低大境序号（凡1/灵2/宝3/圣9/帝12）
#   max_layer              修炼层数上限（1–9）
#   source                 获取来源 general|sect|sansxiu|forbidden（可数组）
#   sect_id                绑定宗门 id（无则 null）
#   contribution_price     宗门兑换贡献价（非宗门功法为 null）
#   obtain                 获取途径文案
#   description            效果描述（半文半白，满层效果）
#   cultivation_multiplier_bp  修炼系数 ×10000（仅心法非 10000；攻击/防御/辅助恒 10000）
#   layer_formula          层数加成公式参数：第 n 层系数 = base_coef_bp × (1 + 0.08 × n)
#   skill                  主动术法参数（心法为 0/0/0）
# ============================================================

