# ------------------------------------------------------------
# 口径与校验备忘
# ------------------------------------------------------------
# 1) 层数加成：第 n 层系数 = base_coef_bp × (1 + 0.08 × n)（§4.3 通式）。
#    例：宝阶中品 base=15700，第 9 层 = 15700 × 1.72 = 27004bp ≈ 2.70×。
# 2) 心法最多同时装备 1 部（玄阵心体质例外，可 2 部）；
#    攻击/防御/辅助各最多 3 部。
# 3) 越阶惩罚：越一阶（如 Lv.18 修宝阶）参悟速度 ×0.6；越两阶以上系数 ×0.3
#    且每次参悟 15% 概率走火入魔。惩罚系数写在引擎，不在本表。
# 4) 校验断言：techniques 恰 41 条；id 唯一；36 个既有 SEED_TECHNIQUES id 全覆盖；
#    tier ∈ {fan,ling,bao,sheng,di}；sub_tier ∈ {xia,zhong,shang}；
#    宗门功法恰 24 条且 sect_id 与 sects.yaml.techniques 一一对应；
#    source 含 sect 者必须带 sect_id 与 contribution_price。
